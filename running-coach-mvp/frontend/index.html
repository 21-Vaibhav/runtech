<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RunTech Coach - Login</title>
  <style>
    :root {
      --bg: #0a0b0f;
      --panel: #14161d;
      --line: #2a2f3a;
      --text: #eef1f7;
      --muted: #b0b6c4;
      --radius: 16px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(1000px 500px at 120% -10%, #2a2d36, transparent 60%), linear-gradient(170deg, #07080b, #101219);
      color: var(--text);
      font-family: "Segoe UI", Tahoma, sans-serif;
    }
    .card {
      width: min(560px, 92vw);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      padding: 24px;
    }
    h1 { margin: 0; font-size: 2rem; }
    p { color: var(--muted); line-height: 1.5; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
    a.btn {
      display: inline-block;
      text-decoration: none;
      border-radius: 12px;
      padding: 11px 16px;
      font-weight: 700;
      color: #11131a;
      background: linear-gradient(90deg, #d3d7e2, #babfcb);
    }
    a.link { color: #dbe0ed; }
  </style>
</head>
<body>
  <main class="card">
    <h1>RunTech Coach</h1>
    <p>Secure running analytics with Strava OAuth. Login once to access your private dashboard, sync training data, and get recommendations.</p>
    <div class="actions">
      <a class="btn" href="/auth/login">Login with Strava</a>
      <a class="btn" href="/dashboard">Go to Dashboard</a>
    </div>
    <p><a class="link" href="/privacy">Privacy Policy</a> | <a class="link" href="/support">Support</a></p>
  </main>
  <script>
    (async function () {
      try {
        const response = await fetch('/me', { credentials: 'include' });
        if (response.ok) {
          window.location.replace('/dashboard');
        }
      } catch (_) {}
    })();
  </script>
</body>
</html>
